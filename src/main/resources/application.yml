spring:
  application:
    name: univgo-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      # Boot defaults to 1MB per file, which rejects every photo a phone takes. The threshold
      # spills a part to disk instead of holding the whole request in heap.
      max-file-size: 6MB
      max-request-size: 50MB
      file-size-threshold: 512KB

server:
  port: ${PORT:3000}

jwt:
  secret: ${JWT_SECRET}
  # 15 minutes. Short on purpose: the session cookie is renewed silently from the refresh cookie,
  # so the cost of a narrow window is paid by the browser, not by the person using the app.
  expiration: 900000
  # 30 minutes, sliding: every refresh rotates the token and restarts the window, so an active
  # session never expires while half an hour of inactivity ends it.
  refresh-expiration: 1800000

auth:
  cookie:
    session-name: univgo_session
    refresh-name: univgo_refresh
    # Overridden per environment: production serves the API on another domain over TLS and needs
    # `secure: true` with `same-site: None`.
    secure: false
    same-site: Lax
    domain:

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

aws:
  s3:
    endpoint: ${AWS_ENDPOINT_URL_S3}
    region: ${AWS_REGION}
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}
    bucket: ${AWS_S3_BUCKET}

univgo:
  spaces:
    images:
      # Mirrors `images.sizes` in the frontend's vercel.json: the derivatives are what the browser
      # asks for, so the two lists have to stay in step.
      widths: [640, 960]
      max-per-space: 8
      # A 12 MP JPEG decodes to roughly 48 MB of BufferedImage, so a handful decoded at once
      # exhausts a small instance. Oversized sources are rejected before any decode.
      max-pixels: 24000000
      jpeg-quality: 0.82
